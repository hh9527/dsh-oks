# 纯 workspace 根：这里**没有 crate**，只有三件事 —— 成员清单、共享的包元数据、以及
# **整个工作区的外部依赖**。
#
# 外部依赖只在这里声明一次（版本、feature、default-features 都只有一处），成员一律
# `{ workspace = true }`；这样"这个工作区用了哪些外部件、各是什么版本"有个唯一答案，
# 升级也只需要动这一份。产物由 crates/ 下的成员编出（当前是 oks-wti），
# 插件本体仍是 Node/TypeScript，在 packages/dsh-oks。
[workspace]
resolver = "2"
members = ["crates/oks-wti"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
jaq-core = "3.1.1"
# 只要 base_funs + defs（通用纯 filter 与语言层定义）。刻意**不开** default：
# std 会带进 env/now，time 会带进 localtime/strflocaltime（读进程时区），log 会带进 stderr/debug。
jaq-std = { version = "3.0.3", default-features = false }
jaq-json = "2.0.3"
# 组装好的那一层（编译器 + 加载器 + 报错排版）。刻意关掉 default：`std-all` 会把
# `jaq-std/default` 打开（env / now / localtime 的代码就跟着进来了），`formats` 会带进
# YAML/TOML 那些我们不需要的格式。
jaq-all = { version = "0.3.0", default-features = false }
# 时区与日历用 jiff：`tzdb-bundle-always` 把 tzdata 编进产物（wasm 里没有 /usr/share/zoneinfo，
# 内嵌数据还跨机器一致）。default 里的 tz-system / tzdb-bundle-platform 都不要。
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# 纯能力组（数学 / 正则 / 格式化），与 jaq-std 用的是同一批：一个字节进、一个字节出，不碰外部状态。
libm = "0.2"
regex-bites = "0.1"
base64 = "0.22"
urlencoding = "2.1"
bstr = "1"

# 体积优先：这些 crate 的产物要作为旁资产随插件分发。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
