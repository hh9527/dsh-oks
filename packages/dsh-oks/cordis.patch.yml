# 插入一行 Host 插件：把**工作区声明的**知识服务与数据文件注册成十九个原生工具——
# oks_search / oks_references / oks_info / oks_check_query_intent / oks_exec_query_intent / create_data /
# jq_transform / oks_render_figure / oks_check_report / oks_render_report / oks_artifacts /
# work_read / work_write / work_edit / work_list / work_delete（后五个只作用在 .work/ 内的工作区：
# jq 程序、报告正文、任何草稿文件）——
# 外加两个与模型无关的辅助工具：create_current_ctx_data（把当轮会话上下文读一次、落成材料——
# 求值器里没有时钟，相对时间的边界都由那份材料在 jq 里算）与 va_ask（插件自己装配、自己复用词汇助手）。
# 知识探索的入口是 oks_info 的 key "index"；这里不写任何形状假设。
#
# 这一行不需要知道任何模型：领域、artifact、dataFile 全部来自工作区根目录的 oks.json
# （{"domain":"<领域名>","artifact":"<相对 oks.json 的 .wasm 路径>",
#   "dataFile":"<相对 oks.json 的 .sqlite 路径>"}），config 留空即可。
#
# 需要覆盖工作区声明时才写 config（优先级：config > oks.json > 默认值）：
#   domain / artifact / dataFile / requestTimeoutMs / retryAcceptedSubset /
#   queryTimeoutMs / queryMaxRows
#   （时区来自请求上下文或调用参数；工作区来自会话头 cwd；运行时取不到就报错）
#
# 宿主是 Node 自带的进程内 wasm worker，直接导入产物里的 telora.snapshot 段——
# 当前只支持快照产物。查询由另一个 worker 用 node:sqlite **只读**执行；命中的结果写进
# 工作区 .oks/data/ 的内部材料（图表件写 .oks/figures/，报表写 artifacts/），数据行默认不进模型上下文。
#
# 这一行只有 node 半边（工具），所以写进 agent preset 的 plugins 即可：工具面只在该 preset 的
# 作用域内生效，profile 顶层不必多一行。图在服务端画成 SVG 落进工作区，由 agent 引用进回答。
- insert:
    - id: oks
      name: '@local/dsh-oks'
      config: {}
