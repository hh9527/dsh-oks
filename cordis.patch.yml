# 插入一行 Host 插件：把**工作区声明的**知识服务注册成 oks_info / oks_check_intent /
# oks_query 三个工具，外加 time_now / time_calc 两个与模型无关的时间辅助工具。
# 知识探索的入口是 oks_info 的 key "index"；这里不写任何形状假设。
#
# 这一行不需要知道任何模型：领域、artifact、dataFile 全部来自工作区根目录的 oks.json
# （{"domain":"<领域名>","artifact":"<相对 oks.json 的 .wasm 路径>",
#   "dataFile":"<相对 oks.json 的 .sqlite 路径>"}），config 留空即可。
#
# 需要覆盖工作区声明时才写 config（优先级：config > oks.json > 默认值）：
#   domain / artifact / dataFile / requestTimeoutMs / retryAcceptedSubset /
#   queryTimeoutMs / queryMaxRows
#   （时区来自请求上下文或调用参数；工作区来自会话头 cwd；运行时取不到就报错）
#
# 宿主是 Node 自带的进程内 wasm worker，直接导入产物里的 telora.snapshot 段——
# 当前只支持快照产物。查询由另一个 worker 用 node:sqlite **只读**执行；插件不写任何文件。
- insert:
    - id: oks
      name: '@local/dsh-oks'
      config: {}
